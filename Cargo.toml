[package]
name = "api_migrado"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "mysql", "macros", "rust_decimal"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
jsonwebtoken = "9.3.1"
bcrypt = "0.17.0"
